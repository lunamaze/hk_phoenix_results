name: Update data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "21 * * * *"   # 改為每小時第 43 分（UTC），避開熱門時段減少嚴重延遲

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Update data.json
        run: |
          python update_data_json.py

      - name: Commit updated data.json if changed
        run: |
          if git diff --quiet -- site/public/data.json; then
            echo "No data.json changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/public/data.json
            git commit -m "chore: update data.json"
            
            # 💡 關鍵修正：在 push 前先拉取遠端最新代碼並 rebase，防止 race condition
            git pull --rebase origin main
            
            git push origin main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # 💡 順便升級到 Node 22，消滅舊版 Node 的 Deprecation 警告
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install frontend deps
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4